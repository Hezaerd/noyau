name: Bug report
description: Report broken behavior, regressions, or reliability issues.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, crashes, or reliability problems.
        Keep the report focused on one problem.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - apps/web
        - apps/server
        - packages/domain
        - packages/protocol
        - packages/config
        - CI / tooling
        - docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic repro when possible.
      placeholder: |
        1. Run `bun run dev:web`
        2. Open ...
        3. Submit command ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main @ abc1234

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Linux, Bun 1.3.14, Chrome 135 ...

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste the most relevant output only. Redact secrets.
      render: shell

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Temporary workaround, if any.
