# Packager unsigned. latest/nightly passent par GitHub Releases, sans
# notarization ni electron-updater (la signature Developer ID manque encore).
# afterPack pose une signature ad-hoc macOS avant le DMG : identity null laisse
# la signature linker d'Electron, et Gatekeeper traite le .app comme corrompu.
# appId aligné sur resolveAppIdentity("latest") dans scripts/electron-launcher.ts.
appId: dev.noyau.desktop
productName: Noyau
artifactName: Noyau-${version}-${os}-${arch}.${ext}
afterPack: scripts/after-pack.cjs
directories:
  output: release
files:
  - dist-electron/main.cjs
  - dist-electron/preload.cjs
  - dist-electron/renderer/**/*
  - dist-electron/release-channel.json
  # Le main bundle déjà effect / @noyau. Sans ça, electron-builder recopie
  # les dependencies workspace (docs Effect comprises) dans l'ASAR.
  - "!**/node_modules/**"
  - "!**/*.map"
# Serveur enfant hors ASAR : ELECTRON_RUN_AS_NODE charge un vrai fichier ESM.
extraResources:
  - from: dist-electron/server
    to: server
asar: true
npmRebuild: false
nodeGypRebuild: false
electronLanguages:
  - en
mac:
  identity: null
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: assets/prod/app-icon.icns
  target:
    - dir
win:
  signAndEditExecutable: false
  icon: assets/prod/app-icon.png
  target:
    - dir
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
