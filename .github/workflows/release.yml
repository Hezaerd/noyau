name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - latest
          - nightly
      version:
        description: Version for latest (for example 0.1.0 or v0.1.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: release_meta
        name: Resolve release version
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          package_version="$(node -e 'console.log(require("./apps/desktop/package.json").version)')"
          mapfile -t tags < <(git tag --list 'v*')
          node apps/desktop/scripts/release-version.ts \
            --event "${GITHUB_EVENT_NAME}" \
            --dispatch-channel "${DISPATCH_CHANNEL:-latest}" \
            --dispatch-version "${DISPATCH_VERSION:-}" \
            --tag-name "${GITHUB_REF_NAME}" \
            --package-version "$package_version" \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            -- "${tags[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        run: bun run build

      - name: Package unsigned installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node apps/desktop/scripts/package-desktop.ts \
            --"${{ matrix.platform }}" \
            --"${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --skip-build

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/collect-release-assets.ts \
            --from apps/desktop/release \
            --to release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          NAME: ${{ needs.preflight.outputs.release_name }}
          REF: ${{ needs.preflight.outputs.ref }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.dmg release-assets/*.exe)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No installer files to publish." >&2
            ls -R release-assets || true
            exit 1
          fi

          args=(
            "$TAG"
            --title "$NAME"
            --target "$REF"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$MAKE_LATEST" == "true" ]]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi

          gh release create "${args[@]}" "${files[@]}"
