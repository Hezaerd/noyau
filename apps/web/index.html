<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Renderer de Noyau Desktop" />
    <title>Noyau</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f4fb;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f0f13;
        }
      }

      html.dark,
      html.dark body {
        background: #0f0f13;
      }

      #noyau-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: inherit;
      }

      #noyau-boot-splash[hidden] {
        display: none;
      }

      #noyau-boot-splash img {
        display: block;
        width: 6rem;
        height: 6rem;
      }
    </style>
  </head>
  <body>
    <div id="noyau-boot-splash">
      <img id="noyau-boot-splash-mark" width="96" height="96" alt="" />
      <script>
        ;(() => {
          const raw = new URLSearchParams(location.search).get("channel")
          const channel =
            raw === "development" || raw === "latest" || raw === "nightly" ? raw : "latest"
          const mark = document.getElementById("noyau-boot-splash-mark")
          if (mark instanceof HTMLImageElement) {
            mark.src = "/boot-splash-" + channel + ".svg"
          }
        })()
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
