<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Noyau Desktop renderer" />
    <title>Noyau</title>
    <script>
      ;(() => {
        const preference = (() => {
          try {
            const stored = window.localStorage.getItem("noyau:appearance")
            return stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system"
          } catch {
            return "system"
          }
        })()
        const systemUsesDarkColors =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        const resolvedAppearance =
          preference === "dark" || (preference === "system" && systemUsesDarkColors)
            ? "dark"
            : "light"
        document.documentElement.classList.toggle("dark", resolvedAppearance === "dark")
        document.documentElement.style.colorScheme = resolvedAppearance

        // Ask the native shell to follow the stored choice as soon as its bridge is available.
        // The renderer applies the same preference again after boot to retain normal sync.
        try {
          const sync = window.noyauDesktop?.setTheme(preference)
          sync?.catch(() => undefined)
        } catch {
          // A renderer without the desktop bridge still has the correct local theme.
        }
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f4fb;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f0f13;
        }
      }

      html.dark,
      html.dark body {
        background: #0f0f13;
      }

      html:not(.dark),
      html:not(.dark) body {
        background: #f5f4fb;
      }

      #noyau-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: inherit;
      }

      #noyau-boot-splash[hidden] {
        display: none;
      }

      #noyau-boot-splash img {
        display: block;
        width: 6rem;
        height: 6rem;
      }
    </style>
  </head>
  <body>
    <div id="noyau-boot-splash">
      <img id="noyau-boot-splash-mark" width="96" height="96" alt="" />
      <script>
        ;(() => {
          const desktopChannel = window.noyauDesktop && window.noyauDesktop.releaseChannel
          const raw =
            desktopChannel === "development" ||
            desktopChannel === "latest" ||
            desktopChannel === "nightly"
              ? desktopChannel
              : new URLSearchParams(location.search).get("channel")
          const channel =
            raw === "development" || raw === "latest" || raw === "nightly" ? raw : "latest"
          const mark = document.getElementById("noyau-boot-splash-mark")
          if (mark instanceof HTMLImageElement) {
            mark.src = "/boot-splash-" + channel + ".svg"
          }
        })()
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
